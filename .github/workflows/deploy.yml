name: Deploy Backend

on:
  push:
    paths:
      - 'apps/api/**'
    branches:
      - main
  pull_request:
    paths:
      - 'apps/api/**'
    branches:
      - main
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.0'

      - name: Run Tests
        working-directory: apps/api
        run: go test -v ./...

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker Image
        run: |
          IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/kybern-api:${{ github.sha }}
          docker build -t $IMAGE_NAME -f apps/api/Dockerfile apps/api

      - name: Push Docker Image
        if: github.event_name == 'push'
        run: |
          IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/kybern-api:${{ github.sha }}
          docker push $IMAGE_NAME

  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: SSH and Update
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Authenticate with GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Pull latest image
            docker pull ghcr.io/${{ github.repository_owner }}/kybern-api:latest
            
            # Update standard container
            # Assuming docker-compose.yml is in the root directory
            cd ~/portfolio && docker-compose up -d --no-deps --build api
